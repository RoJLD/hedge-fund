[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hedge-fund"
version = "0.1.1"
description = "Live delta-neutral cross-venue funding-carry deployment: decision engine + testnet execution adapters + fund-ops monitoring + daily paper/testnet harness. Proprietary."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Robin Denis" }]

dependencies = [
    "quant-marketdata[live] @ git+https://github.com/RoJLD/quant-marketdata.git@v0.2.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
deploy = ["hyperliquid-python-sdk>=0.1", "eth-account>=0.10"]
dev = ["pytest>=7", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
